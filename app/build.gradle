plugins { id 'com.android.application' }

android {
    namespace 'dev.local.lunatv'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.local.lunatv'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.3.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // Personal sideload build: signed with the local debug key, debugging disabled.
        release { signingConfig signingConfigs.debug; minifyEnabled false; debuggable false }
    }
    ndkVersion '27.1.12297006'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    lint { abortOnError true }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
